version: "2"

linters:
  enable:
    - gosec
    - godot
    - misspell
    - errorlint
    - revive
  settings:
    staticcheck:
      checks: ["all"]
  exclusions:
    warn-unused: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

formatters:
  enable:
    - gofmt
    - goimports
