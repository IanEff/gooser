# GoReleaser v2 — release automation for gooser.
# Local dry run:  goreleaser release --snapshot --clean
# Validate:       goreleaser check
# https://goreleaser.com
version: 2

project_name: gooser

before:
  hooks:
    - go mod tidy

builds:
  - id: gooser
    main: ./cmd/gooser
    binary: gooser
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Reproducible builds: stamp the commit time, not wall-clock build time.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # Strip symbols if you've gotta...
      # - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: gooser
    ids:
      - gooser
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Software Bill of Materials, one per archive, generated with syft.
sboms:
  - artifacts: archive

# Keyless cosign signing of the checksums file (covers every artifact by
# transitivity). Uses the ambient GitHub OIDC token — needs id-token: write
# in the release workflow. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/IanEff/gooser/.*' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: IanEff
    name: gooser
  draft: false
  prerelease: auto
