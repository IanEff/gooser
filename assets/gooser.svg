<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%">
  <defs>
    <linearGradient id="glamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca9ee6" /> <!-- Frappe Mauve -->
      <stop offset="50%" stop-color="#f4b8e4" /> <!-- Frappe Pink -->
      <stop offset="100%" stop-color="#8caaee" /> <!-- Frappe Blue -->
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#303446" rx="15" /> <!-- Frappe Base -->

  <!-- Goose Icon (Abstract Glam) -->
  <path d="M 120 130 C 100 130 90 110 90 90 C 90 60 110 50 130 50 C 140 50 150 55 160 65 L 180 55 C 185 52 190 58 185 63 L 165 80 C 165 110 150 130 120 130 Z" fill="none" stroke="url(#glamGradient)" stroke-width="6" filter="url(#neonGlow)"/>
  <circle cx="125" cy="75" r="4" fill="#c6d0f5" /> <!-- Frappe Text -->

  <!-- Text -->
  <text x="220" y="125" font-family="'Courier New', monospace" font-size="72" font-weight="bold" fill="url(#glamGradient)" filter="url(#neonGlow)" letter-spacing="4">
    gooser
  </text>

  <!-- Subtitle -->
  <text x="225" y="155" font-family="'Courier New', monospace" font-size="14" fill="#a5adce" letter-spacing="2">
    HARD REFRESH. NO BLOAT.
  </text>
</svg>
