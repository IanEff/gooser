name: release

# Tag-gated: the deliberate "ship" act. Ordinary pushes to main run CI only;
# pushing a v* tag cuts a signed, SBOM'd GitHub release. (deploy != release)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release object + upload assets
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v3 # provides `cosign` for the signs: stanza

      - uses: anchore/sbom-action/download-syft@v0 # provides `syft` for the sboms: stanza

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
