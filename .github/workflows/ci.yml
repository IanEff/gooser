name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: fmt-check
        run: make fmt-check

      - name: vet
        run: make vet

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: test
        run: make test

      - name: build
        run: make build

  snapshot:
    name: snapshot-artifacts
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: anchore/sbom-action/download-syft@v0

      # Exercises the full .goreleaser.yaml on every CI run (catches config
      # drift before a tag is cut) and produces cross-platform binaries.
      # --skip=sign: keyless cosign needs the OIDC token only the tag-gated
      # release job is granted (id-token: write).
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

      - uses: actions/upload-artifact@v7
        with:
          name: gooser-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
